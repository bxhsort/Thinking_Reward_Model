<svg xmlns="http://www.w3.org/2000/svg" width="528" height="756" viewBox="0 0 528 756" role="img" aria-labelledby="title desc">
<title id="title">Visual generation improves with TRM-guided reinforcement learning</title>
<desc id="desc">Image generation: BAGEL on TIIF-Long improves from 75.62 to 81.43, an absolute gain of 5.81. FLUX.1-dev on GenEval improves from 0.66 to 0.73, a gain of 0.07. Image editing: BAGEL on ImgEdit improves from 3.37 to 3.91, a gain of 0.54. SenseNova-U1.5 on ImgEdit improves from 4.30 to 4.52, a gain of 0.22. Scores retain each benchmark's original scale.</desc>
