[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trm-reward"
version = "0.1.0"
description = "Open-source inference utilities for thinking edit and text-to-image reward models."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TRM Contributors" }]
dependencies = [
  "pillow",
  "huggingface_hub",
]

[project.optional-dependencies]
transformers = [
  "qwen-vl-utils",
  "safetensors",
  "tokenizers",
  "torch",
  "torchvision",
  "transformers",
]
vllm-client = [
  "openai",
]
vllm-server = [
  "openai",
  "vllm",
]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
